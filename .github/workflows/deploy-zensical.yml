# ============================================================
# .github/workflows/deploy-zensical.yml (ALL-PY-REPOS)
# ============================================================
# Updated: 2026-10-11
#
# WHAT: A GitHub Actions workflow that automatically publishes project documentation.
#       GitHub Actions is GitHub's built-in project automation service.
#       This YAML file tells GitHub what commands to run and when to run them.
#
# WHEN: Use for projects that use Python tooling and Zensical to publish a
#       professional documentation website describing the project,
#       its data, methods, processes, and results.
#       Projects do not need a src/ Python application.
#
# TRIGGER: Runs automatically when changes are pushed to the main branch.
#          It can also be started manually from the GitHub Actions tab.
#
# WHY: Publishing documentation makes project work accessible to others.
#      Automated deployment keeps the public website current without
#      requiring the developer to rebuild and upload it manually.
#
# CI/CD: Continuous Integration (CI) automatically checks changes.
#        Continuous Delivery/Deployment (CD) prepares or publishes work.
#        This workflow performs CD by building and publishing the website.
#        A separate workflow handles CI.
#
# SKILLS: Git, GitHub, GitHub Actions, CI/CD, automated deployment,
#         project automation, and professional documentation.
#
# TOOLS: Zensical builds the documentation website.
#        GitHub Pages hosts the published website.
#
# REQ: Repository MUST contain .python-version, uv.lock, and zensical.toml.
# REQ: Repository Settings > Pages > Build and deployment > Source:
#      GitHub Actions.
# REQ: Deployment MUST use the committed uv.lock without updating it.
# ============================================================

# Name shown in the repo Actions tab.
name: Docs Deploy (Zensical)

on:
  push:
    branches: [main] # WHY: Deploy docs on every push to GitHub branch `main`.
  workflow_dispatch: # WHY: Allow manual trigger from Actions tab.

permissions:
  contents: read # WHY: Needed to checkout code.
  pages: write # WHY: Required to deploy to GitHub Pages.
  id-token: write # WHY: Required by deploy-pages for OIDC authentication.

concurrency:
  group: github-pages
  cancel-in-progress: false
  # WHY: GitHub Pages is a shared deployment target.
  # OBS: Do not cancel an in-progress Pages deployment with another deployment.

env:
  PYTHONUNBUFFERED: "1" # WHY: Real-time log output in CI.
  PYTHONIOENCODING: "utf-8" # WHY: Consistent encoding across platforms.
  UV_FROZEN: "1" # WHY: Deployment MUST use uv.lock without updating it.


jobs:
  # ============================================================
  # JOB 1: BUILD AND UPLOAD DOCUMENTATION
  # ============================================================
  build:
    name: Build Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pages: read

    steps:
      # A) ASSEMBLE: Checkout code and set up environment

      - name: A1) Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: A2) Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: A3) Install uv (with caching and uv.lock awareness)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: A4) Install project Python
        run: uv python install

      - name: A5) Install dependencies from committed lockfile
        run: uv sync --frozen

      - name: A6) Show tool versions
        run: |
          uv --version
          uv run python --version
          if [ -f "zensical.toml" ]; then
            uv run python -m zensical --version
          fi

      # D) BUILD AND UPLOAD

      - name: D1) Build docs with Zensical
        run: |
          if [ ! -f "zensical.toml" ]; then
            echo "zensical.toml not found; refusing to deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          uv run python -m zensical build

      - name: D2) Verify site output exists
        run: |
          if [ ! -d "site" ]; then
            echo "## Documentation build output missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Expected directory 'site/' was not created." >> "$GITHUB_STEP_SUMMARY"
            echo "Check the Zensical build step and zensical.toml configuration." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: D3) Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  # ============================================================
  # JOB 2: DEPLOY DOCUMENTATION
  # ============================================================
  deploy:
    name: Deploy Documentation site
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: D4) Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
